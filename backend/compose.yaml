name: code-clash

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  judge-runtime:
    build:
      context: .
      dockerfile: judge.Dockerfile
    image: code-clash-judge:latest
    command: ["sleep", "infinity"]
    restart: unless-stopped
